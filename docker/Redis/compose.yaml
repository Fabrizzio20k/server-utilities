services:
  redis:
    image: redis:latest
    container_name: redis_app
    command: redis-server --requirepass Ut3c2026 --appendonly yes
    restart: unless-stopped
    ports:
      - "63790:6379" 
    volumes:
      - redis_data:/data
    networks:
      - proxy_net

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redis_insight
    restart: unless-stopped
    networks:
      - proxy_net

volumes:
  redis_data:

networks:
  proxy_net:
    external: true