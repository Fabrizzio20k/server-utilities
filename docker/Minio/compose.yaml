services:
  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: minio_app
    restart: unless-stopped
    command: server /mnt/data --console-address ":9001" --license /minio.license
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin_seguro
      - MINIO_BROWSER_REDIRECT_URL=https://minio-console.example.com
      - MINIO_SERVER_URL=https://minio.example.com
    volumes:
      - minio_data:/mnt/data
      - ./minio.license:/minio.license:ro
    networks:
      - proxy_net

volumes:
  minio_data:

networks:
  proxy_net:
    external: true