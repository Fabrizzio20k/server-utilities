name: jenkins-docker
services:
  jenkins-docker:
    image: docker:dind
    container_name: jenkins_dind
    privileged: true
    restart: unless-stopped
    environment:
      - DOCKER_TLS_CERTDIR=/certs
    volumes:
      - jenkins-docker-certs:/certs/client
      - jenkins-data:/var/jenkins_home
    networks:
      proxy_net:
        aliases:
          - docker

  jenkins:
    build: .
    container_name: jenkins_app
    restart: unless-stopped
    depends_on:
      - jenkins-docker
    environment:
      - DOCKER_HOST=tcp://docker:2376
      - DOCKER_CERT_PATH=/certs/client
      - DOCKER_TLS_VERIFY=1
    volumes:
      - jenkins-data:/var/jenkins_home
      - jenkins-docker-certs:/certs/client:ro
    networks:
      - proxy_net

volumes:
  jenkins-data:
  jenkins-docker-certs:

networks:
  proxy_net:
    external: true